# Builds every Melon plugin on GitHub's machines:
#   Windows (VST3 + Standalone), macOS (VST3 + AU + Standalone, Intel + Apple Silicon)
#   and Linux (LV2 + VST3 + Standalone).
# The files end up under Actions > (run) > Artifacts.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -A x64 "-DMELON_FORMATS=VST3;Standalone"
      - name: Build
        run: cmake --build build --config Release --parallel
      - uses: actions/upload-artifact@v4
        with:
          name: Melon-Plugins-Windows-x64
          path: |
            build/plugins/*/*_artefacts/Release/VST3/
            build/plugins/*/*_artefacts/Release/Standalone/

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        # Universal binaries: one plugin runs on both Apple Silicon (arm64) and Intel (x86_64) Macs
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            "-DMELON_FORMATS=VST3;AU;Standalone" \
            "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13
      - name: Build
        run: cmake --build build --parallel 3
      - name: Test
        run: |
          set -e
          for t in build/plugins/*/*_test_*; do if [ -x "$t" ]; then "$t"; fi; done
      - name: Validate Audio Units (auval)
        # Informational: a failure here is shown in the log but does not fail the build
        continue-on-error: true
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/plugins/*/*_artefacts/Release/AU/*.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          for code in Geq1 Chr1 Flg1 Gsy1 Drt1 Muf1 God1 Rvb1 D290; do
            echo "=== auval $code ==="
            auval -v aufx "$code" Meln | tail -n 3
          done
      - uses: actions/upload-artifact@v4
        with:
          name: Melon-Plugins-macOS-Universal
          path: |
            build/plugins/*/*_artefacts/Release/VST3/
            build/plugins/*/*_artefacts/Release/AU/
            build/plugins/*/*_artefacts/Release/Standalone/

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 4
      - name: Test
        run: |
          set -e
          for t in build/plugins/*/*_test_*; do if [ -x "$t" ]; then "$t"; fi; done
      - uses: actions/upload-artifact@v4
        with:
          name: Melon-Plugins-Linux-x64
          path: |
            build/plugins/*/*_artefacts/Release/LV2/
            build/plugins/*/*_artefacts/Release/VST3/
            build/plugins/*/*_artefacts/Release/Standalone/
